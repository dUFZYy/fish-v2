<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art sheet — lakeArt / anglerArt</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #14181f;
      color: #e6e9ef;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px 20px 60px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    h1 + p { margin: 0 0 24px; color: #9aa3b2; max-width: 70ch; }
    section {
      margin: 0 0 36px;
      padding-top: 14px;
      border-top: 1px solid #2a2f3a;
    }
    h2 { font-size: 14px; margin: 0 0 4px; color: #ffd23a; }
    p.note { margin: 0 0 10px; color: #9aa3b2; max-width: 90ch; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    figure {
      margin: 0;
      background:
        linear-gradient(45deg, #222 25%, transparent 25%) -8px 0/16px 16px,
        linear-gradient(-45deg, #222 25%, transparent 25%) -8px 0/16px 16px,
        linear-gradient(45deg, transparent 75%, #222 75%) -8px 0/16px 16px,
        linear-gradient(-45deg, transparent 75%, #222 75%) -8px 0/16px 16px,
        #2e2e33;
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      border: 1px solid #3a3f4a;
      border-radius: 4px;
      padding: 4px;
    }
    figure canvas { display: block; }
    figcaption {
      font-size: 10px;
      color: #b7bfcc;
      text-align: center;
      padding-top: 3px;
      max-width: 220px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>lakeArt.ts / anglerArt.ts — art sheet</h1>
  <p>
    Every bake function, drawn directly with plain Canvas 2D (no Atlas/Baker/PixiJS involved),
    at three light levels where applicable. Checkerboard = transparent. See each file's header
    comment for what's baked vs. drawn live by the scene.
  </p>
  <div id="app"></div>
  <script type="module" src="/dev/artSheet.ts"></script>
</body>
</html>
